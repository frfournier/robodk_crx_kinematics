[project]
name = "crx-kinematics"
version = "0.5.0"
description = "Typed NumPy wrapper for the Fanuc CRX kinematics solver"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Typing :: Typed",
]

[project.optional-dependencies]
robodk = ["robodk>=6.0.2"]

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "mpmath==1.3.0",
    "pandas>=3.0.6",
    "pytest>=9.1.1",
    "robodk>=6.0.2",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-root = "python"
module-name = "crx_kinematics"
source-include = ["docs/python-wrapper.md"]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(levelname)s %(message)s"
# addopts = "-q"
# If Tracebacks are too long, use --tb=line to shorten 
addopts = "-q --tb=line -ra"

testpaths = ["tests"]

[tool.ruff]
src = ["test"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false
docstring-code-format = true
preview = true

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "B",
    "UP",
    "RUF",
    "FURB",
    "PIE",
    "I",
    "C4",
    "SIM",
    "RET",
    "PERF",
    "ASYNC",
    "LOG",
    "BLE",
    "TRY",
    "DTZ",
    "A",
    "ARG",
    "RSE",
    "NPY",
    "ANN",
    "TC",
    "PTH",
    "PT",
    "S",
    "PLE",
    "PLW",
    "PLR",
]

ignore = [
    "E501",
    "RUF002",
    "ANN401",
    "TRY003",
    "TRY300",
    "TRY301",
    "PLR0913",
    "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = [
    "ANN",   # Benchmark and fixture scripts are maintained as standalone tools.
    "B904",  # CLI error reporting intentionally hides nested exception details.
    "E402",  # Some scripts configure repository paths before importing helpers.
    "PERF401", # Explicit loops are easier to step through in benchmark workflows.
    "PLR",   # Keep command-line workflows readable without function extraction.
    "RUF001", # Benchmark output uses typographic symbols intentionally.
    "S",     # Subprocesses use fixed local tools and assert internal prerequisites.
]
"python/crx_kinematics/_native.py" = [
    "ANN", # ctypes signatures are assembled dynamically at runtime.
]
"tests/**/*.py" = [
    "S101",    # Assert is expected in tests
    "ANN",     # Test annotations aren't always necessary
    "ARG",     # Fixtures may require unused parameters
    "PLR2004", # Literal values are common in assertions
    "E402",    # Some scripts add the repository root before importing helpers.
    "PERF401", # Explicit loops make test setup easier to read.
    "PLR0915", # Long regression scenarios keep related assertions together.
    "PLR0917", # Test helpers often mirror the function under test.
    "PLR0912", # Fixture generators keep related validation branches together.
    "PT011",   # Broad exception tests validate public input rejection.
    "PT018",   # Combined assertions keep related invariants together.
    "BLE001",  # RoboDK may report multiple exception types during launch.
    "PLW2901", # Fixture parser reuses short loop variables in unpacking.
    "S603",    # Tests and fixtures invoke known local tools.
    "S607",    # Tests and fixtures invoke tools available on PATH.
]

[tool.ty.src]
include = ["tests"]

[tool.ty.environment]
python-platform = "win32"
